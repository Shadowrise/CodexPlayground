<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Circle</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .circle {
      width: 20px;
      height: 20px;
      background-color: blue;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="circle" role="img" aria-label="Blue circle"></div>
</body>
</html>
